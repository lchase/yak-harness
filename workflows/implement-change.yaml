# implement-change — the harness reference workflow (yak-harness spec §4.1).
#
# One workflow spanning bug / feature / chore. `assess` classifies the
# change; the feature-only steps (design, design-review, docs) self-skip
# off that classification. Self-contained: inline schemas, inline
# prompts, no `.yak/` directory — it ships with the harness and runs
# against any repo yak is pointed at.
#
# v1 deviations from the §4.1 sketch (tracked for a follow-up):
#   - `deliver` is linear `build -> verify -> checkpoint`, not a bounded
#     `loop`. The `build` agent self-corrects via its own test runs;
#     `verify` is the deterministic gate; `checkpoint` suspends for a
#     human iff `verify` is still red. yak's `loop` can't expose an
#     artifact to downstream steps, so a real retry loop would leave
#     `approve-pr` unordered against it. The `review`/`rank` fan-out is
#     also not here yet.
#   - `design-review` has no confidence auto-skip — a human reviews
#     every design.
#   - feature steps pass state through worktree files (DESIGN.md), not
#     artifacts, because a skipped step writes no artifact for a
#     downstream `needs` to read.
#
# Artifact names referenced in `skipIf` must be jexl identifiers — no
# hyphens (`verify-result` parses as subtraction). Step ids may hyphenate.

name: implement-change
version: "1"

inputSchema:
  inline:
    type: object
    properties:
      issueRef: { type: string }
    required: [issueRef]

steps:
  - id: assess
    needs: [input]
    agent:
      prompt:
        inline: |
          Triage GitHub issue {{input.issueRef}} for an automated
          implementation run.

          Run `gh issue view {{input.issueRef}}` to read the issue, then
          read enough of the codebase to classify the change. Emit:

          - kind: bug | feature | chore
          - confidence: 0..1 — how sure you are that the issue is
            well-scoped AND you know exactly where the change goes. Use a
            value below 0.85 whenever the issue asks you to investigate,
            hints the obvious fix may be incomplete, or the blast radius
            is unclear. A localized, pinned bug is ~0.95.
          - needsDesign: true only if there is a real design decision — a
            new module, a data-model or persistence choice, an API shape.
            Almost always false for bug fixes and chores.
          - likelySubtasks: rough count of independent edits (1 for a
            localized change).
          - needsDocs: true if user-facing docs (README, etc.) must
            change.
          - summary: one paragraph — what the change is and where it goes.
      schema:
        inline:
          type: object
          properties:
            kind: { type: string, enum: [bug, feature, chore] }
            confidence: { type: number }
            needsDesign: { type: boolean }
            likelySubtasks: { type: integer }
            needsDocs: { type: boolean }
            summary: { type: string }
          required: [kind, confidence, needsDesign, likelySubtasks, needsDocs, summary]
      tools: [Read, Grep, Glob, Bash]
    produces: assessment

  - id: confirm-scope
    needs: [assessment, input]
    skipIf: "assessment.confidence > 0.85"
    gate:
      schema:
        inline:
          type: object
          properties:
            decision: { type: string, enum: [proceed, narrow, abort], default: proceed }
            notes: { type: string, default: "" }
          required: [decision]
      render:
        inline: |
          **{{input.issueRef}}** — {{assessment.summary}}

          kind: {{assessment.kind}} · confidence: {{assessment.confidence}}
          needsDesign: {{assessment.needsDesign}} · likelySubtasks: {{assessment.likelySubtasks}}

          Confidence is below the auto-proceed threshold. Confirm scope:

          - decision: proceed | narrow | abort
          - notes: guidance for the run (required when narrowing)
    produces: scopeDecision

  - id: design
    needs: [assessment, scopeDecision]
    skipIf: "!assessment.needsDesign"
    agent:
      prompt:
        inline: |
          {{assessment.summary}}

          This change has a design decision to make. Read the relevant
          code and write `DESIGN.md` at the repo root: the options, the
          choice, and the reason, in under a page. Do NOT implement
          anything yet.
      schema:
        inline:
          type: object
          properties:
            summary: { type: string }
          required: [summary]
      tools: [Read, Grep, Glob, Write]
    produces: design

  - id: design-review
    needs: [assessment, input, design]
    skipIf: "!assessment.needsDesign"
    gate:
      schema:
        inline:
          type: object
          properties:
            decision: { type: string, enum: [approve, rework], default: approve }
            notes: { type: string, default: "" }
          required: [decision]
      render:
        inline: |
          A design for **{{input.issueRef}}** ({{assessment.summary}}) was
          written to `DESIGN.md` on the run branch. Review it.

          - decision: approve | rework
          - notes: what to change (required when reworking)
    produces: designDecision

  - id: plan
    needs: [assessment, input, scopeDecision, designDecision]
    agent:
      prompt:
        inline: |
          Plan the implementation of {{input.issueRef}} — {{assessment.summary}}

          If `DESIGN.md` exists at the repo root, follow it. Produce an
          ordered checklist of the concrete edits. Do NOT implement.
      schema:
        inline:
          type: object
          properties:
            steps: { type: array, items: { type: string } }
          required: [steps]
      tools: [Read, Grep, Glob]
    produces: plan

  # --- deliver ---------------------------------------------------------
  # A linear build -> verify -> checkpoint. yak's `loop` combinator can't
  # yet expose an artifact to downstream steps (a `loop` step's
  # `produces` is a no-op), so the bounded retry loop the §4.1 sketch
  # draws would leave `approve-pr` unordered against it. The `build`
  # agent runs and fixes the checks itself; `verify` is the deterministic
  # gate; `checkpoint` suspends for a human iff `verify` is still red.

  - id: build
    needs: [plan, input]
    agent:
      prompt:
        inline: |
          Implement {{input.issueRef}} in the working tree, following this
          plan:

          {{plan.steps}}

          If `DESIGN.md` exists at the repo root, follow it.

          Then run `npm test`, `npm run typecheck` and `npm run build`
          yourself and fix everything red before you finish — a separate
          check re-runs all three and the run stops for a human if they
          do not pass.

          When everything passes, stage and commit all your changes:
          `git add -A && git commit -m "<concise message referencing
          {{input.issueRef}}>"`. The run opens a PR from this commit.
      schema:
        inline:
          type: object
          properties:
            summary: { type: string }
          required: [summary]
      tools: [Read, Grep, Glob, Edit, Write, Bash]
    produces: buildNote

  - id: verify
    needs: [buildNote]
    command:
      run: "npm test && npm run typecheck && npm run build"
      failOn: never
      capture: [stdout, stderr, exitCode]
    produces: verifyResult

  - id: checkpoint
    needs: [verifyResult, input]
    skipIf: "verifyResult.exitCode == 0"
    gate:
      schema:
        inline:
          type: object
          properties:
            decision: { type: string, enum: [proceed, investigate, abandon], default: proceed }
            notes: { type: string, default: "" }
          required: [decision]
      render:
        inline: |
          **{{input.issueRef}}** — implementation is done but `npm test &&
          npm run typecheck && npm run build` is still RED on the run
          branch. The harness stopped here rather than open a broken PR.

          - decision: investigate (a human takes the branch) | abandon | proceed (open the PR anyway)
          - notes: what you found
    produces: checkpoint

  - id: docs
    needs: [assessment, input, checkpoint]
    skipIf: "!assessment.needsDocs"
    agent:
      prompt:
        inline: |
          The code change for {{input.issueRef}} ({{assessment.summary}})
          is already implemented and committed. Update the user-facing
          docs (README and similar) to match, then
          `git add -A && git commit -m "docs: ..."`.
      schema:
        inline:
          type: object
          properties:
            summary: { type: string }
          required: [summary]
      tools: [Read, Grep, Glob, Edit, Write]
    produces: docsNote

  - id: approve-pr
    needs: [assessment, input, checkpoint]
    gate:
      schema:
        inline:
          type: object
          properties:
            decision: { type: string, enum: [approve, reject], default: approve }
            notes: { type: string, default: "" }
          required: [decision]
      render:
        inline: |
          **{{input.issueRef}}** — {{assessment.summary}}

          The implementation is complete and `npm test`, `npm run
          typecheck` and `npm run build` all pass on the run branch.
          Review the diff.

          - decision: approve | reject
          - notes: reason for rejecting (required when rejecting)
    produces: prDecision

  - id: open-pr
    needs: [prDecision]
    skipIf: "prDecision.decision != 'approve'"
    command:
      run: 'git push -u origin HEAD && gh pr create --fill'
      capture: [stdout, stderr, exitCode]
    produces: pr-url
